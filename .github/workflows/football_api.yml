name: Football API Auto Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check API Key
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "错误：API_FOOTBALL_KEY 没有读取到"
            exit 1
          fi

          echo "API Key 已成功读取"

      - name: Fetch Football API
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          echo "开始抓取日期：$DATE"

          mkdir -p 数据

          curl --fail-with-body \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=${DATE}" \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            --header "Accept: application/json" \
            --output "数据/fixtures_${DATE}.json"

          echo "抓取成功"
          echo "文件：数据/fixtures_${DATE}.json"

      - name: Commit Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 数据/

          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
            exit 0
          fi

          git commit -m "data: update football fixtures"

          git pull --rebase origin main

          git push origin main