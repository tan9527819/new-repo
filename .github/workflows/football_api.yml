name: Football API Auto Fetch
on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 02:00 自动运行
    - cron: "0 2 * * *"
jobs:
  fetch:
    name: Fetch Football API Data
    runs-on: ubuntu-latest
    environment: football-api
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ============================================================
      # 2. Check API Key
      # ============================================================
      - name: Check API Key
        shell: bash
        run: |
          set -e
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "错误：API_FOOTBALL_KEY 没有读取到"
            echo "请检查 GitHub Settings -> Environments -> football-api -> Secrets"
            exit 1
          fi
          echo "API_FOOTBALL_KEY 已成功读取"
      # ============================================================
      # 3. Setup Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ============================================================
      # 4. Install dependencies
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      # ============================================================
      # 5. Fetch Football API
      #
      # 重要：
      # Free 套餐无法保证当前赛季历史 fixtures 可访问。
      # 因此这里：
      #
      # A. 先抓 live=all
      # B. 再尝试历史赛季
      # C. 如果 API 返回 Free plan 限制，不让 Workflow 失败
      # ============================================================
      - name: Fetch Football API
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          API_KEY = os.environ.get("API_FOOTBALL_KEY")
          if not API_KEY:
              raise SystemExit("API_FOOTBALL_KEY 未读取到")
          BASE_URL = "https://v3.football.api-sports.io"
          OUTPUT_DIR = Path("data/api_football")
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
          # --------------------------------------------------------
          # 请求函数
          # --------------------------------------------------------
          def api_get(endpoint, params=None):
              if params is None:
                  params = {}
              query = "&".join(
                  f"{key}={value}"
                  for key, value in params.items()
              )
              url = f"{BASE_URL}/{endpoint}"
              if query:
                  url += "?" + query
              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY,
                      "Accept": "application/json",
                      "User-Agent": "football-data-github-actions"
                  },
                  method="GET"
              )
              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:
                      body = response.read().decode("utf-8")
                      return json.loads(body)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  try:
                      data = json.loads(body)
                  except Exception:
                      data = {
                          "errors": {
                              "http_error": body
                          }
                      }
                  return {
                      "response": [],
                      "errors": data.get(
                          "errors",
                          {"http_error": str(error)}
                      )
                  }
              except Exception as error:
                  return {
                      "response": [],
                      "errors": {
                          "request_error": str(error)
                      }
                  }
          # ========================================================
          # 1. 获取当前实时比赛
          # ========================================================
          print("")
          print("=" * 60)
          print("1. 获取实时比赛")
          print("=" * 60)
          live_data = api_get(
              "fixtures",
              {
                  "live": "all"
              }
          )
          live_file = OUTPUT_DIR / "live.json"
          with live_file.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  live_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          live_count = len(
              live_data.get("response", [])
          )
          print(
              f"实时比赛抓取完成：{live_count} 场"
          )
          # ========================================================
          # 2. 检查 API 返回错误
          # ========================================================
          errors = live_data.get("errors", {})
          if errors:
              print("")
              print("API 返回信息：")
              print(json.dumps(
                  errors,
                  ensure_ascii=False,
                  indent=2
              ))
          # ========================================================
          # 3. 历史数据
          #
          # 这里不要再请求：
          #
          # 2026-09-29
          # 2026-10-01
          # 等当前赛季日期
          #
          # 因为 Free Plan 可能拒绝当前赛季。
          #
          # 先使用历史赛季进行数据库建设。
          # ========================================================
          HISTORICAL_SEASONS = [
              2024,
              2023,
              2022
          ]
          print("")
          print("=" * 60)
          print("2. 获取历史赛季数据")
          print("=" * 60)
          for season in HISTORICAL_SEASONS:
              print("")
              print(f"正在检查赛季：{season}")
              data = api_get(
                  "fixtures",
                  {
                      "season": season
                  }
              )
              season_errors = data.get(
                  "errors",
                  {}
              )
              season_response = data.get(
                  "response",
                  []
              )
              output_file = (
                  OUTPUT_DIR
                  / f"fixtures_{season}.json"
              )
              with output_file.open(
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )
              if season_errors:
                  error_text = json.dumps(
                      season_errors,
                      ensure_ascii=False
                  )
                  print(
                      f"赛季 {season} API 返回限制/错误："
                  )
                  print(error_text)
                  if "Free" in error_text:
                      print(
                          f"赛季 {season} 被当前 Free "
                          "套餐限制，已跳过。"
                      )
                  continue
              print(
                  f"赛季 {season} 获取完成："
                  f"{len(season_response)} 场"
              )
          # ========================================================
          # 4. 生成运行状态文件
          # ========================================================
          print("")
          print("=" * 60)
          print("3. 生成运行状态")
          print("=" * 60)
          now = datetime.now(
              timezone.utc
          ).isoformat()
          status = {
              "updated_at_utc": now,
              "live_matches": live_count,
              "historical_seasons": HISTORICAL_SEASONS,
              "source": "API-Football",
              "workflow": "Football API Auto Fetch"
          }
          status_file = (
              OUTPUT_DIR / "status.json"
          )
          with status_file.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  status,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          print(
              "Football API 数据抓取流程完成"
          )
          print("")
          print(
              "注意：Free 套餐限制不会再导致整个 Workflow 失败。"
          )
          PY
      # ============================================================
      # 6. Check generated files
      # ============================================================
      - name: Check generated files
        shell: bash
        run: |
          echo "========================================"
          echo "生成的数据文件："
          echo "========================================"
          find data/api_football \
            -type f \
            -maxdepth 2 \
            -print \
            2>/dev/null || true
          echo ""
          echo "目录大小："
          du -sh data/api_football \
            2>/dev/null || true
      # ============================================================
      # 7. Commit data
      #
      # 关键修复：
      # 原来的 git add data 被 .gitignore 忽略
      #
      # 这里使用 git add -f
      # ============================================================
      - name: Commit data
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 强制加入被 .gitignore 忽略的数据文件
          git add -f data/api_football/
          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
            exit 0
          fi
          echo "准备提交数据："
          git diff --cached --stat
          git commit \
            -m "chore: update football api data"
          git push
          echo "数据提交完成"