name: Football API Auto Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: football-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Football API
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          echo "================================"
          echo "开始抓取日期: ${DATE}"
          echo "================================"

          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "错误：API_FOOTBALL_KEY 没有读取到"
            exit 1
          fi

          mkdir -p 数据

          curl \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=${DATE}" \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            --output "数据/fixtures_${DATE}.json" \
            --write-out "\nHTTP_STATUS=%{http_code}\n" \
            --silent \
            --show-error

          echo "================================"
          echo "API 数据已获取"
          echo "================================"

          echo "数据文件："
          ls -lh "数据/fixtures_${DATE}.json"

          echo "数据预览："
          head -c 1000 "数据/fixtures_${DATE}.json"

      - name: Check API response
        run: |
          DATE=$(date -u +%Y-%m-%d)

          if [ ! -s "数据/fixtures_${DATE}.json" ]; then
            echo "错误：API 返回文件为空"
            exit 1
          fi

          echo "数据文件检查通过"

      - name: Commit Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 数据/

          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
          else
            git commit -m "data: update football fixtures"
            git push
          fi