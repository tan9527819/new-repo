name: Football API Auto Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  fetch:
    name: Fetch Football API Data
    runs-on: ubuntu-latest
    environment: football-api

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check API Key
        shell: bash
        run: |
          set -e

          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "错误：API_FOOTBALL_KEY 没有读取到"
            echo "请检查 GitHub Settings -> Environments -> football-api -> Secrets"
            exit 1
          fi

          echo "API_FOOTBALL_KEY 已成功读取"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch Football API
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import datetime
          import urllib.request

          api_key = os.environ.get("API_FOOTBALL_KEY")

          if not api_key:
              raise SystemExit("API_FOOTBALL_KEY 没有读取到")

          today = datetime.date.today()

          dates = [
              today - datetime.timedelta(days=1),
              today,
              today + datetime.timedelta(days=1),
              today + datetime.timedelta(days=2),
          ]

          os.makedirs("data/api_football", exist_ok=True)

          for date in dates:
              date_str = date.isoformat()

              url = (
                  "https://v3.football.api-sports.io/fixtures"
                  f"?date={date_str}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": api_key
                  }
              )

              print(f"正在抓取：{date_str}")

              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.loads(response.read().decode("utf-8"))

              output_file = (
                  f"data/api_football/fixtures_{date_str}.json"
              )

              with open(output_file, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              results = data.get("response", [])

              print(
                  f"{date_str} 抓取完成，比赛数量：{len(results)}"
              )

          print("Football API 数据抓取完成")
          PY

      - name: Check generated files
        shell: bash
        run: |
          echo "生成的数据文件："
          find data/api_football -type f -maxdepth 1 -print || true

      - name: Commit data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/api_football

          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
            exit 0
          fi

          git commit -m "chore: update football api data"
          git push