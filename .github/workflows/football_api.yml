name: Football API Auto Fetch

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check API Key
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e

          if [ -z "${API_FOOTBALL_KEY:-}" ]; then
            echo "错误：没有读取到 API_FOOTBALL_KEY"
            echo "请检查 GitHub Repository Secrets"
            exit 1
          fi

          echo "API Key 已成功读取"

      - name: Fetch Football API
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail

          DATE=$(date -u +%Y-%m-%d)
          OUTPUT="数据/fixtures_${DATE}.json"

          echo "开始抓取日期：$DATE"

          mkdir -p 数据

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=${DATE}" \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            --header "Accept: application/json" \
            --output "$OUTPUT"

          if [ ! -s "$OUTPUT" ]; then
            echo "错误：API 返回数据为空"
            exit 1
          fi

          echo "API 数据抓取成功"

          python - "$OUTPUT" <<'PY'
          import json
          import sys

          filename = sys.argv[1]

          with open(filename, "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("errors"):
              print("API 返回错误：")
              print(data["errors"])
              sys.exit(1)

          matches = data.get("response", [])

          print(f"抓取比赛数量：{len(matches)}")
          print(f"保存文件：{filename}")
          PY

      - name: Commit Data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main

          git add 数据/

          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
            exit 0
          fi

          git commit -m "data: update football fixtures"

          git push origin HEAD:main