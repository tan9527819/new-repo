name: Football API Auto Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: football-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Football Data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p 数据

          curl --fail \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=${DATE}" \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            --output "数据/fixtures_${DATE}.json"

          echo "已抓取 ${DATE} 的比赛数据"

      - name: Commit Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 数据/

          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
          else
            git commit -m "data: update football fixtures"
            git push
          fi