name: Football API Auto Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch Football API Data
    runs-on: ubuntu-latest

    environment: football-api

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check API Key
        shell: bash
        run: |
          set -e

          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "错误：API_FOOTBALL_KEY 没有读取到"
            echo "请检查 GitHub Settings -> Secrets and variables -> Actions"
            echo "确认 API_FOOTBALL_KEY 已正确设置"
            exit 1
          fi

          echo "API_FOOTBALL_KEY 已成功读取"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch Football API
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import os
          import json
          import datetime
          import urllib.request
          import urllib.error

          api_key = os.environ.get("API_FOOTBALL_KEY")

          if not api_key:
              raise SystemExit("API_FOOTBALL_KEY 未读取到")

          today = datetime.date.today()

          # Football API 免费套餐：
          # 不再请求过去日期。
          # 只抓取：今天、明天、后天。
          dates = [
              today + datetime.timedelta(days=i)
              for i in range(0, 3)
          ]

          output_dir = "data/api_football"
          os.makedirs(output_dir, exist_ok=True)

          success_count = 0

          for date in dates:
              date_str = date.isoformat()

              url = (
                  "https://v3.football.api-sports.io/fixtures"
                  f"?date={date_str}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": api_key
                  }
              )

              print("=" * 60)
              print(f"正在抓取：{date_str}")

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      status_code = response.status

                      body = response.read().decode(
                          "utf-8"
                      )

                      data = json.loads(body)

                  print(f"HTTP 状态：{status_code}")

              except urllib.error.HTTPError as e:
                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(f"API HTTP 错误：{e.code}")
                  print(error_body)

                  raise SystemExit(
                      f"Football API 请求失败：{date_str}"
                  )

              except urllib.error.URLError as e:
                  print(f"网络请求失败：{e}")

                  raise SystemExit(
                      f"Football API 网络错误：{date_str}"
                  )

              except Exception as e:
                  print(f"请求失败：{e}")

                  raise SystemExit(
                      f"Football API 未知错误：{date_str}"
                  )

              errors = data.get("errors")

              if errors:
                  print("Football API 返回错误：")
                  print(json.dumps(
                      errors,
                      ensure_ascii=False,
                      indent=2
                  ))

                  raise SystemExit(
                      f"Football API 数据错误：{date_str}"
                  )

              results = data.get(
                  "response",
                  []
              )

              output_file = (
                  f"{output_dir}/fixtures_{date_str}.json"
              )

              with open(
                  output_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  f"{date_str} 抓取完成"
              )

              print(
                  f"比赛数量：{len(results)}"
              )

              print(
                  f"保存文件：{output_file}"
              )

              success_count += 1

          print("=" * 60)
          print(
              f"Football API 数据抓取完成，"
              f"成功：{success_count}/{len(dates)}"
          )
          print("=" * 60)

          PY

      - name: Check generated files
        shell: bash
        run: |
          set -e

          echo "生成的数据文件："

          if [ -d "data/api_football" ]; then
            find data/api_football \
              -type f \
              -name "*.json" \
              -print
          else
            echo "错误：data/api_football 目录不存在"
            exit 1
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          set -e

          echo "开始检查 JSON 数据文件..."

          python - <<'PY'
          import json
          from pathlib import Path

          files = list(
              Path("data/api_football").glob("*.json")
          )

          if not files:
              raise SystemExit(
                  "错误：没有找到 JSON 数据文件"
              )

          for file in files:
              print(f"检查：{file}")

              with file.open(
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

              if not isinstance(data, dict):
                  raise SystemExit(
                      f"JSON 格式错误：{file}"
                  )

              print(
                  f"  response 数量："
                  f"{len(data.get('response', []))}"
              )

          print("JSON 数据检查通过")

          PY

      - name: Commit data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "准备提交 API 数据..."

          # data 目录可能被 .gitignore 忽略
          # 使用 -f 强制加入 Git
          git add -f data/api_football/

          echo "当前待提交文件："

          git status --short

          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
            exit 0
          fi

          git commit \
            -m "chore: update football API data"

          git push

          echo "数据已经成功提交并推送到 main"