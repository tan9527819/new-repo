name: Football API Auto Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch Football API Data
    runs-on: ubuntu-latest

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check API Key
        shell: bash
        run: |
          set -e

          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "错误：API_FOOTBALL_KEY 没有读取到"
            echo "请检查 GitHub Settings -> Secrets and variables -> Actions"
            echo "确认 Repository secrets 中存在：API_FOOTBALL_KEY"
            exit 1
          fi

          echo "API_FOOTBALL_KEY 已成功读取"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch Football API
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import datetime
          import urllib.request
          import urllib.error

          api_key = os.environ.get("API_FOOTBALL_KEY")

          if not api_key:
              raise SystemExit("API_FOOTBALL_KEY 未读取到")

          today = datetime.date.today()

          # 抓取前3天、今天、后3天
          dates = [
              today + datetime.timedelta(days=i)
              for i in range(-3, 4)
          ]

          output_dir = "data/api_football"
          os.makedirs(output_dir, exist_ok=True)

          for date in dates:
              date_str = date.isoformat()

              url = (
                  "https://v3.football.api-sports.io/fixtures"
                  f"?date={date_str}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": api_key
                  }
              )

              print(f"正在抓取：{date_str}")

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:
                      data = json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as e:
                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
                  print(f"API HTTP 错误：{e.code}")
                  print(error_body)
                  raise

              except Exception as e:
                  print(f"请求失败：{e}")
                  raise

              errors = data.get("errors")

              if errors:
                  print(f"API 返回错误：{errors}")
                  raise SystemExit(1)

              results = data.get("response", [])

              output_file = (
                  f"{output_dir}/fixtures_{date_str}.json"
              )

              with open(
                  output_file,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  f"{date_str} 抓取完成，比赛数量："
                  f"{len(results)}"
              )

          print("Football API 数据抓取完成")
          PY

      - name: Check generated files
        shell: bash
        run: |
          echo "生成的数据文件："

          find data/api_football \
            -type f \
            -name "*.json" \
            -print

      - name: Commit data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "准备提交 API 数据"

          # data 可能被 .gitignore 忽略
          # 使用 -f 强制加入 Git
          git add -f data/api_football/

          echo "当前待提交文件："
          git status --short

          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
            exit 0
          fi

          git commit -m "chore: update football API data"

          git push