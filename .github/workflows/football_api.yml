name: Football API Auto Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest

    # 非常重要：
    # 你的 API_FOOTBALL_KEY 放在 Environment secrets 里面，
    # 所以这里必须绑定 fetch 环境
    environment: fetch

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API Key
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "错误：API_FOOTBALL_KEY 没有读取到"
            echo "请检查 GitHub Settings -> Environments -> fetch -> Secrets"
            exit 1
          fi

          echo "API_FOOTBALL_KEY 已成功读取"

      - name: Fetch Football API
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e

          DATE=$(date -u +%Y-%m-%d)

          echo "================================"
          echo "开始抓取足球数据"
          echo "日期：$DATE"
          echo "================================"

          mkdir -p data

          curl -L --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 60 \
            -H "x-apisports-key: $API_FOOTBALL_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$DATE" \
            -o "data/fixtures_$DATE.json"

          echo "API 数据抓取成功"

          if [ ! -s "data/fixtures_$DATE.json" ]; then
            echo "错误：API 返回文件为空"
            exit 1
          fi

          echo "文件大小："
          wc -c "data/fixtures_$DATE.json"

          echo "前 300 个字符："
          head -c 300 "data/fixtures_$DATE.json"
          echo

      - name: Commit Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
            exit 0
          fi

          git commit -m "data: update football fixtures"

      - name: Push Data
        run: |
          git pull --rebase origin main
          git push origin HEAD:main